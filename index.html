
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#173b35">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<title>Gazeta FM Cuiabá 99,9</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;
 display:grid;place-items:center;
 padding:20px;
 background:linear-gradient(145deg,#102d28,#28594b);
 color:white;font-family:Arial,sans-serif
}
.radio{
 width:100%;max-width:400px;
 padding:30px 22px;
 border-radius:28px;
 background:#173b35;
 text-align:center;
 box-shadow:0 15px 50px #0008
}
.logo{
 width:120px;height:120px;
 margin:25px auto;
 border-radius:28px;
 background:#e5c46b;color:#173b35;
 display:grid;place-items:center;
 font-size:43px;font-weight:900
}
h1{font-size:26px;margin:12px 0}
.freq{font-size:25px;color:#e5c46b;font-weight:bold}
.status{color:#d4e5dd;font-size:14px}
.player{
 margin:30px 0;
 padding:12px;
 background:#ffffff;
 border-radius:15px;
 overflow:hidden
}
iframe{width:100%;height:145px;border:0}
a{color:#e5c46b;text-decoration:none}
footer{font-size:12px;color:#b7d0c5;margin-top:25px}
</style>
</head>

<body>
<main class="radio">
 <div style="color:#e5c46b;letter-spacing:5px;font-weight:bold">
 GAZETA FM
 </div>

 <div class="logo">GF</div>

 <h1>Gazeta FM Cuiabá</h1>
 <div class="freq">99,9 FM</div>

 <p class="status">Cuiabá • Mato Grosso</p>

 <div class="player">
  <iframe
   src="https://fb.radiosnaweb.com/hls/player.php?alt=42&autostart=false&canal=gazetacuiabahd&canal2=gazetacuiabahd&dnipf=5a2b083e9f360.streamlock.net&lar=320&mute=50&nome=gazetacuiabahd&tipo=3&wowza=0"
   allow="autoplay"
   title="Player oficial Gazeta FM">
  </iframe>
 </div>

 <p>Transmissão ao vivo</p>

 <p>
  <a href="https://www.gazetafmcuiaba.com.br/"
     target="_blank">
     Site oficial da Gazeta FM
  </a>
 </p>

 <footer>
  Rádio Gazeta FM 99,9<br>
  Cuiabá - Mato Grosso
 </footer>
</main>

<script>
if('serviceWorker' in navigator){
 window.addEventListener('load',()=>{
  navigator.serviceWorker.register('./sw.js');
 });
}
</script>
</body>
</html>
